[project]
name = "comfyui-flyway"
description = "Flyway toolbox for ComfyUI: subtitle translation, TTS merge, audio save, lyric alignment, batch image save and Florence2 video tagging helpers"
version = "1.6.0"
license = {text = "MIT"}

[project.urls]
Repository = "https://github.com/switflynet/comfyui-flyway"

[tool.setuptools.packages.find]
where = ["."]
include = ["comfyui_flyway*"]

[tool.setuptools.package-data]
comfyui_flyway = ["*.py", "*.md", "*.txt"]
